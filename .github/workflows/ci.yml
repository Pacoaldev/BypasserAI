name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck (incl. tests)
        run: npm run typecheck

      # tsx v4 requires `--import` (Node >=20.6), so the test suite runs on
      # 20/22. The shipped CLI (plain JS in dist/) still supports Node 18,
      # which is why build is validated across the full matrix.
      - name: Test
        if: matrix.node-version != '18.x'
        run: npm test

      - name: Build
        run: npm run build
